<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苏新皓｜成员详情</title>
  <style>
    /* ======== 基础重置 ======== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: #050509;
      color: #f8f7ff;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      overflow-x: hidden;
      cursor: none;
    }
    a { color: inherit; text-decoration: none; }

    /* ======== 主题色（每个成员页只改这里就能换风格） ======== */
    :root {
      --theme-color: #ff3a4f;        /* 苏新皓：信号红 */
      --theme-color-2: #ff8896;      /* 副色：浅粉红 */
      --theme-glow: rgba(255, 58, 79, 0.6);
      --theme-glow-soft: rgba(255, 58, 79, 0.22);
    }

    /* ======== 背景层 ======== */
    .bg-stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 28%, rgba(255,255,255,0.22) 0, transparent 24%),
        radial-gradient(circle at 78% 18%, var(--theme-glow-soft) 0, transparent 26%),
        radial-gradient(circle at 50% 82%, rgba(255,180,180,0.10) 0, transparent 30%),
        linear-gradient(135deg, #050509 0%, #150407 52%, #4a0d18 100%);
      z-index: -3;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.06) 49%, transparent 51%);
      background-size: 180px 180px;
      opacity: 0.3;
      z-index: -2;
      pointer-events: none;
    }
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--theme-glow) 0%, transparent 65%);
      filter: blur(90px);
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      z-index: -1;
      pointer-events: none;
      animation: glowPulse 6s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.7; transform: translateX(-50%) scale(1.15); }
    }

    /* 流星 */
    .meteor {
      position: fixed;
      width: 180px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffffff, var(--theme-color));
      border-radius: 999px;
      filter: drop-shadow(0 0 10px var(--theme-glow));
      opacity: 0;
      animation: meteorMove 5s linear infinite;
      z-index: -1;
    }
    .meteor:nth-child(1) { top: 18%; left: 80%; animation-delay: 0s; }
    .meteor:nth-child(2) { top: 38%; left: 90%; animation-delay: 2s; }
    .meteor:nth-child(3) { top: 60%; left: 70%; animation-delay: 3.5s; }
    @keyframes meteorMove {
      0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate(-900px, 520px) rotate(-35deg); opacity: 0; }
    }

    /* ======== 自定义光标：WiFi 信号（信号灯主题） ======== */
    .wifi-cursor {
      position: fixed;
      left: 0; top: 0;
      width: 40px;
      height: 40px;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      transition: transform 0.25s ease;
    }
    .wifi-cursor svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 6px var(--theme-glow));
    }
    /* 圆点 + 三道弧分别命名，做依次点亮的动画 */
    .wifi-cursor .wifi-dot {
      fill: var(--theme-color);
      animation: wifiBlink 1.6s ease-in-out infinite;
      animation-delay: 0s;
    }
    .wifi-cursor .wifi-arc-1 {
      stroke: var(--theme-color);
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      animation: wifiBlink 1.6s ease-in-out infinite;
      animation-delay: 0.18s;
    }
    .wifi-cursor .wifi-arc-2 {
      stroke: var(--theme-color);
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      animation: wifiBlink 1.6s ease-in-out infinite;
      animation-delay: 0.36s;
    }
    .wifi-cursor .wifi-arc-3 {
      stroke: var(--theme-color);
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      animation: wifiBlink 1.6s ease-in-out infinite;
      animation-delay: 0.54s;
    }
    @keyframes wifiBlink {
      0%, 70%, 100% { opacity: 0.25; }
      15%, 50% { opacity: 1; }
    }
    /* hover：三道弧全部锁定常亮 + 整体放大 */
    .wifi-cursor.hovering {
      transform: translate(-50%, -50%) scale(1.4);
    }
    .wifi-cursor.hovering .wifi-dot,
    .wifi-cursor.hovering .wifi-arc-1,
    .wifi-cursor.hovering .wifi-arc-2,
    .wifi-cursor.hovering .wifi-arc-3 {
      animation: none;
      opacity: 1;
    }
    .wifi-cursor.hovering svg {
      filter: drop-shadow(0 0 12px var(--theme-color)) drop-shadow(0 0 24px var(--theme-glow));
    }

    /* 拖尾：信号波纹 */
    .wifi-trail {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      border: 1.5px solid var(--theme-color);
      border-radius: 50%;
      animation: signalRipple 1s ease-out forwards;
      will-change: transform, opacity;
    }
    @keyframes signalRipple {
      0% { width: 8px; height: 8px; opacity: 0.85; }
      100% { width: 50px; height: 50px; opacity: 0; }
    }

    /* 拖尾：小红点（"信号已读" 微粒） */
    .wifi-dot-trail {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--theme-color);
      box-shadow: 0 0 8px var(--theme-color), 0 0 14px var(--theme-glow);
      transform: translate(-50%, -50%);
      animation: dotFade 0.9s ease-out forwards;
    }
    @keyframes dotFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--drift-x, 0), var(--drift-y, 20px)) scale(0.3);
      }
    }

    /* 点击：满格信号爆发（三圈错开扩散） */
    .signal-burst {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--theme-color);
      transform: translate(-50%, -50%);
      animation: signalBoom 0.8s ease-out forwards;
    }
    .signal-burst.delay-1 { animation-delay: 0.1s; }
    .signal-burst.delay-2 { animation-delay: 0.2s; }
    @keyframes signalBoom {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); border-width: 2px; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(4.5); border-width: 1px; }
    }

    /* ======== 顶部返回栏 ======== */
    .top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 20px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(5,5,9,0.85), transparent);
      backdrop-filter: blur(8px);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 999px;
      letter-spacing: 2px;
      font-size: 13px;
      transition: 0.3s;
      background: rgba(255,255,255,0.05);
    }
    .back-link:hover {
      transform: translateX(-4px);
      background: var(--theme-glow-soft);
      border-color: var(--theme-color);
    }
    .top-name {
      font-size: 14px;
      letter-spacing: 4px;
      color: rgba(248,247,255,0.7);
    }

    /* ======== 主体布局 ======== */
    .profile-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 42% 58%;
      gap: 60px;
      align-items: center;
      padding: 100px 8vw 60px;
      position: relative;
    }

    /* ======== 照片（带 3D 倾斜） ======== */
    .photo-wrap {
      perspective: 1200px;
      height: 78vh;
      min-height: 540px;
      position: relative;
      opacity: 0;
      transform: translateX(-60px);
      animation: slideInLeft 1.2s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes slideInLeft {
      to { opacity: 1; transform: translateX(0); }
    }

    .photo {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background:
        linear-gradient(to top, rgba(0,0,0,0.55), transparent 50%),
        url("images/suxinhao1.jpg") center top / cover no-repeat;
      box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 60px var(--theme-glow-soft);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
    }
    .photo-wrap:hover .photo {
      box-shadow: 0 40px 110px rgba(0,0,0,0.65), 0 0 80px var(--theme-glow);
    }

    /* 照片角标：成员编号 */
    .photo-badge {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid var(--theme-color);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--theme-color);
      z-index: 2;
    }

    /* ======== 右侧信息区 ======== */
    .info {
      max-width: 680px;
      position: relative;
    }
    .info > * {
      opacity: 0;
      transform: translateX(40px);
      animation: slideInRight 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .info > *:nth-child(1) { animation-delay: 0.5s; }
    .info > *:nth-child(2) { animation-delay: 0.65s; }
    .info > *:nth-child(3) { animation-delay: 0.8s; }
    .info > *:nth-child(4) { animation-delay: 0.95s; }
    .info > *:nth-child(5) { animation-delay: 1.1s; }
    .info > *:nth-child(6) { animation-delay: 1.25s; }
    @keyframes slideInRight {
      to { opacity: 1; transform: translateX(0); }
    }

    .eyebrow {
      color: var(--theme-color);
      letter-spacing: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--theme-color);
      border-radius: 999px;
      background: var(--theme-glow-soft);
    }

    .info h1 {
      font-size: clamp(58px, 8vw, 118px);
      margin: 12px 0 8px;
      letter-spacing: 6px;
      text-shadow: 0 0 35px rgba(255,255,255,0.22), 0 0 60px var(--theme-glow-soft);
      line-height: 1;
    }

    .name-en {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      letter-spacing: 8px;
      color: rgba(248,247,255,0.55);
      margin-bottom: 20px;
    }

    .tag {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 30px;
      font-weight: 300;
    }

    /* ======== 数据条 ======== */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 30px;
    }
    .stat-item {
      padding: 18px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      text-align: center;
      transition: 0.3s;
    }
    .stat-item:hover {
      transform: translateY(-4px);
      border-color: var(--theme-color);
      background: var(--theme-glow-soft);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--theme-color);
      letter-spacing: 1px;
      text-shadow: 0 0 20px var(--theme-glow);
    }
    .stat-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(248,247,255,0.6);
      margin-top: 4px;
    }

    /* ======== 信息卡（标签徽章） ======== */
    .info-card {
      padding: 26px;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      margin-bottom: 28px;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .info-row:last-child { border-bottom: none; }
    .info-key {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--theme-color);
      min-width: 80px;
    }
    .info-val {
      flex: 1;
      color: rgba(248,247,255,0.88);
      font-size: 15px;
    }
    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .keyword {
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--theme-glow-soft);
      border: 1px solid var(--theme-color);
      font-size: 12px;
      color: var(--theme-color);
      letter-spacing: 1px;
    }

    /* ======== 应援留言区 ======== */
    .signal-section {
      padding: 80px 8vw;
      position: relative;
    }
    .signal-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 5vw, 56px);
      letter-spacing: 4px;
      margin-bottom: 12px;
      text-align: center;
    }
    .signal-subtitle {
      text-align: center;
      color: rgba(248,247,255,0.6);
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .signal-input-row {
      display: flex;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto 40px;
    }
    .signal-input {
      flex: 1;
      padding: 16px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      outline: none;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 15px;
      transition: 0.3s;
    }
    .signal-input:focus {
      border-color: var(--theme-color);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 25px var(--theme-glow-soft);
    }
    .signal-send {
      padding: 16px 30px;
      border-radius: 999px;
      border: 1px solid var(--theme-color);
      background: var(--theme-glow-soft);
      color: var(--theme-color);
      letter-spacing: 3px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
    }
    .signal-send:hover {
      background: var(--theme-color);
      color: #050509;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px var(--theme-glow);
    }

    .signal-wall {
      max-width: 880px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .signal-bubble {
      padding: 16px 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      animation: bubbleIn 0.5s ease forwards;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .signal-bubble .from {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--theme-color);
      margin-bottom: 8px;
    }
    .signal-bubble .text {
      color: rgba(248,247,255,0.88);
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
    }
    .signal-empty {
      text-align: center;
      color: rgba(248,247,255,0.4);
      font-size: 14px;
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    /* ======== 烟花容器 ======== */
    .firework-particle {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
    }
    @keyframes fireworkFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(0); }
    }

    /* ======== 响应式 ======== */
    @media (max-width: 900px) {
      .profile-page {
        grid-template-columns: 1fr;
        padding: 100px 6vw 40px;
      }
      .photo-wrap {
        height: 65vh;
        min-height: 430px;
      }
      .info h1 { font-size: 58px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-value { font-size: 22px; }
      body { cursor: auto; }
      .butterfly-cursor, .angel-cursor, .wifi-cursor { display: none; }
    }
  </style>
</head>
<body>
  <!-- 背景层 -->
  <div class="bg-stars"></div>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="meteor"></div>
  <div class="meteor"></div>
  <div class="meteor"></div>
  <div class="wifi-cursor" id="wifiCursor">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <!-- 底部圆点 -->
      <circle class="wifi-dot" cx="20" cy="32" r="3" />
      <!-- 第一道弧（最里面，最小） -->
      <path class="wifi-arc-1" d="M 14 26 Q 20 21 26 26" />
      <!-- 第二道弧（中间） -->
      <path class="wifi-arc-2" d="M 9 21 Q 20 11 31 21" />
      <!-- 第三道弧（最外面，最大） -->
      <path class="wifi-arc-3" d="M 5 16 Q 20 3 35 16" />
    </svg>
  </div>

  <!-- 顶部返回栏 -->
  <div class="top-bar">
    <a class="back-link" href="index.html">‹ BACK TO HOME</a>
    <span class="top-name">MEMBER · 苏新皓</span>
  </div>

  <!-- 主体 -->
  <main class="profile-page">
    <div class="photo-wrap" id="photoWrap">
      <div class="photo-badge">MEMBER 05</div>
      <div class="photo" id="photo"></div>
    </div>

    <div class="info">
      <span class="eyebrow">MEMBER PROFILE</span>
      <h1>苏新皓</h1>
      <div class="name-en">SU XINHAO</div>
      <p class="tag">把每一次转身变成光。</p>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="daysToBirthday">--</div>
          <div class="stat-label">DAYS TO 🎂</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="cheerCount">0</div>
          <div class="stat-label">应援次数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">2007</div>
          <div class="stat-label">SINCE</div>
        </div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <span class="info-key">生日</span>
          <span class="info-val">2007.01.12</span>
        </div>
        <div class="info-row">
          <span class="info-key">应援名</span>
          <span class="info-val keywords">
            <span class="keyword">信号灯 🚦</span>
            <span class="keyword">永远为他亮着</span>
          </span>
        </div>
        <div class="info-row">
          <span class="info-key">关键词</span>
          <span class="info-val keywords">
            <span class="keyword">舞蹈</span>
            <span class="keyword">舞台</span>
            <span class="keyword">表现力</span>
          </span>
        </div>
        <div class="info-row">
          <span class="info-key">介绍</span>
          <span class="info-val">把每一次转身变成光，把每一次抬眼接通信号。信号灯们 · 我们永远在他的频道里。</span>
        </div>
      </div>
    </div>
  </main>

  <!-- 应援留言区 -->
  <section class="signal-section">
    <h2 class="signal-title">FAN SIGNAL</h2>
    <p class="signal-subtitle">信号灯们 · 接通这个频道，把心意传给他 🚦</p>

    <div class="signal-input-row">
      <input type="text" class="signal-input" id="signalInput" placeholder="留下你的应援话语..." maxlength="80">
      <button class="signal-send" id="signalSend">SEND ✦</button>
    </div>

    <div class="signal-wall" id="signalWall"></div>
  </section>

  <script>
    // ============ 配置：每个成员页只改这里 ============
    const MEMBER = {
      key: 'suxinhao',
      name: '苏新皓',
      birthday: { month: 1, day: 12 },
      themeColor: '#ff3a4f'
    };

    // ============ WiFi 信号光标 ============
    const wifi = document.getElementById('wifiCursor');
    let lastTrailTime = 0;
    let lastRippleTime = 0;
    const TRAIL_INTERVAL = 70;
    const RIPPLE_INTERVAL = 180; // 信号波纹间隔大一些，避免太密

    document.addEventListener('mousemove', (e) => {
      // wifi 图标的"圆点"位置应该在底部，所以让 cursor 整体上移一点
      // 让圆点正好对准鼠标点击位置
      wifi.style.left = e.clientX + 'px';
      wifi.style.top = (e.clientY - 8) + 'px';

      const now = performance.now();
      // 小红点拖尾
      if (now - lastTrailTime > TRAIL_INTERVAL) {
        lastTrailTime = now;
        spawnDotTrail(e.clientX, e.clientY);
      }
      // 信号波纹（更间隔）
      if (now - lastRippleTime > RIPPLE_INTERVAL) {
        lastRippleTime = now;
        spawnRipple(e.clientX, e.clientY);
      }
    });

    function spawnDotTrail(x, y) {
      const dot = document.createElement('div');
      dot.className = 'wifi-dot-trail';
      dot.style.left = (x + (Math.random() * 14 - 7)) + 'px';
      dot.style.top = (y + (Math.random() * 14 - 7)) + 'px';
      dot.style.setProperty('--drift-x', (Math.random() * 24 - 12) + 'px');
      dot.style.setProperty('--drift-y', (Math.random() * 22 + 5) + 'px');
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 900);
    }

    function spawnRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'wifi-trail';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1000);
    }

    // hover 链接：满格信号锁定
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('a, button, input, .stat-item, .photo-wrap')) {
        wifi.classList.add('hovering');
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (!e.relatedTarget || !e.relatedTarget.closest('a, button, input, .stat-item, .photo-wrap')) {
        wifi.classList.remove('hovering');
      }
    });

    // 点击：满格信号爆发（三圈错开扩散）
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 3; i++) {
        const burst = document.createElement('div');
        burst.className = 'signal-burst' + (i > 0 ? ' delay-' + i : '');
        burst.style.left = e.clientX + 'px';
        burst.style.top = e.clientY + 'px';
        document.body.appendChild(burst);
        setTimeout(() => burst.remove(), 1000 + i * 100);
      }

      // 6 个红色信号粒子向外发射
      for (let i = 0; i < 6; i++) {
        const dot = document.createElement('div');
        dot.className = 'wifi-dot-trail';
        dot.style.left = e.clientX + 'px';
        dot.style.top = e.clientY + 'px';
        const angle = (Math.PI * 2 * i) / 6;
        const dist = 50 + Math.random() * 30;
        dot.style.setProperty('--drift-x', Math.cos(angle) * dist + 'px');
        dot.style.setProperty('--drift-y', Math.sin(angle) * dist + 'px');
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 900);
      }
    });

    // ============ 照片 3D 视差倾斜 ============
    const photoWrap = document.getElementById('photoWrap');
    const photo = document.getElementById('photo');
    photoWrap.addEventListener('mousemove', (e) => {
      const rect = photoWrap.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      photo.style.transform = `rotateY(${x * 8}deg) rotateX(${-y * 8}deg) scale(1.02)`;
    });
    photoWrap.addEventListener('mouseleave', () => {
      photo.style.transform = 'rotateY(0) rotateX(0) scale(1)';
    });

    // ============ 生日倒计时 ============
    function updateBirthdayCountdown() {
      const now = new Date();
      const year = now.getFullYear();
      let bday = new Date(year, MEMBER.birthday.month - 1, MEMBER.birthday.day);
      if (bday < now) {
        bday = new Date(year + 1, MEMBER.birthday.month - 1, MEMBER.birthday.day);
      }
      const diffDays = Math.ceil((bday - now) / (1000 * 60 * 60 * 24));
      document.getElementById('daysToBirthday').textContent = diffDays;
    }
    updateBirthdayCountdown();

    // ============ 应援计数（localStorage） ============
    const cheerKey = `cheer_${MEMBER.key}`;
    const cheerCountEl = document.getElementById('cheerCount');

    function getCheerCount() {
      return parseInt(localStorage.getItem(cheerKey) || '0');
    }
    function setCheerCount(n) {
      localStorage.setItem(cheerKey, String(n));
      cheerCountEl.textContent = n;
    }
    setCheerCount(getCheerCount());

    // 数字滚动动画
    function animateCheerCount(from, to) {
      const duration = 600;
      const start = performance.now();
      function step(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        cheerCountEl.textContent = Math.round(from + (to - from) * eased);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // ============ 烟花爆炸 ============
    function spawnFirework(x, y) {
      const colors = [MEMBER.themeColor, '#ffffff', '#c7b8ff'];
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'firework-particle';
        const angle = (Math.PI * 2 * i) / 24;
        const distance = 80 + Math.random() * 80;
        const fx = Math.cos(angle) * distance;
        const fy = Math.sin(angle) * distance;
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = color;
        p.style.boxShadow = `0 0 12px ${color}`;
        p.style.setProperty('--fx', fx + 'px');
        p.style.setProperty('--fy', fy + 'px');
        p.style.animation = `fireworkFly ${0.8 + Math.random() * 0.4}s ease-out forwards`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1300);
      }
    }

    // ============ 应援留言（localStorage） ============
    const wallKey = `wall_${MEMBER.key}`;
    const wallEl = document.getElementById('signalWall');
    const inputEl = document.getElementById('signalInput');
    const sendBtn = document.getElementById('signalSend');

    function getMessages() {
      try {
        return JSON.parse(localStorage.getItem(wallKey) || '[]');
      } catch (e) { return []; }
    }
    function saveMessages(arr) {
      localStorage.setItem(wallKey, JSON.stringify(arr));
    }

    function renderWall() {
      const messages = getMessages();
      if (!messages.length) {
        wallEl.innerHTML = '<div class="signal-empty">信号还在等待接通...第一束光由你点亮 🚦</div>';
        return;
      }
      wallEl.innerHTML = messages.slice().reverse().map(m => `
        <div class="signal-bubble">
          <div class="from">FAN · ${m.time}</div>
          <div class="text">${escapeHtml(m.text)}</div>
        </div>
      `).join('');
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      const messages = getMessages();
      const now = new Date();
      const time = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      messages.push({ text, time });
      // 只保留最近 50 条
      if (messages.length > 50) messages.shift();
      saveMessages(messages);
      inputEl.value = '';
      renderWall();

      // 发送时：应援数 +1 + 烟花
      const oldCount = getCheerCount();
      const newCount = oldCount + 1;
      setCheerCount(newCount);
      animateCheerCount(oldCount, newCount);

      // 在按钮位置爆烟花
      const rect = sendBtn.getBoundingClientRect();
      spawnFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    renderWall();

    // ============ 滚动到底部触发烟花（彩蛋） ============
    let firedBottom = false;
    window.addEventListener('scroll', () => {
      const scrollBottom = window.innerHeight + window.scrollY;
      const docHeight = document.body.offsetHeight;
      if (!firedBottom && scrollBottom >= docHeight - 50) {
        firedBottom = true;
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight - 100;
        spawnFirework(cx, cy);
        setTimeout(() => spawnFirework(cx - 150, cy - 50), 200);
        setTimeout(() => spawnFirework(cx + 150, cy - 50), 400);
      }
    });
  </script>
</body>
</html>
